# Render Blueprint. Creates the stelfind web service — see
# https://render.com/docs/blueprint-spec.
#
# `sync: false` marks a value Render will prompt for in the dashboard
# instead of reading from this file: every real secret is marked that way,
# since this file is committed to the repo and nothing here should ever be
# a live key, the same rule config.go enforces at startup.
#
# A service with no transport configured starts fine and answers 404 on every
# /webhook/{channel}.
#
# Free-tier note: Render's free web service instance type spins down after
# 15 minutes without an inbound HTTP request. stelfind runs Horizon
# ingestion continuously in a background goroutine inside the same process —
# on the free tier that goroutine freezes with the rest of the process
# whenever it spins down, so payments stop being indexed while it sleeps.
# Fine for poking at a deploy; move to a paid instance type before this is
# something a real user relies on being up.
#
# The database is not declared here. Render's own free Postgres plan expires
# 30 days after creation — fine for a demo, not for anything meant to stay up
# — so STELFIN_DATABASE_URL instead points at a Neon project (free tier, no
# expiry, scales to zero and wakes on the next query rather than needing a
# manual resume). Create the project at neon.tech, then paste its pooled
# connection string — sslmode=require, which Neon's string already includes
# — into the dashboard.

services:
  - type: web
    name: stelfin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # ingestion will not keep running while the service sleeps — see note above
    healthCheckPath: /health

    # Declared here rather than left to a dashboard toggle, because a service
    # that silently stops tracking main is indistinguishable from one that is
    # merely idle — which is how this deployment came to serve a build from
    # before the rebuild for weeks.
    autoDeploy: true
    envVars:
      # Render injects PORT for the container to listen on; STELFIN_HTTP_ADDR
      # must match it since the app does not read PORT itself.
      - key: PORT
        value: "10000"
      - key: STELFIN_HTTP_ADDR
        value: ":10000"

      # Not known until the first deploy assigns a *.onrender.com URL (or a
      # custom domain is attached) — set this in the dashboard afterward.
      # Confirmation and enroll links carry payment/account authority, so
      # this must be the real public URL, not a placeholder left stale.
      - key: STELFIN_BASE_URL
        sync: false

      # Neon connection string (pooled), e.g.
      # postgres://user:pass@ep-xxx-pooler.region.aws.neon.tech/stelfin?sslmode=require
      - key: STELFIN_DATABASE_URL
        sync: false

      - key: STELFIN_NETWORK
        value: testnet
      - key: STELFIN_HORIZON_URL
        value: https://horizon-testnet.stellar.org

      # Soroban. Without these the service starts fine but cannot see a
      # contract-held treasury at all: HasSoroban() is false, so the RPC is
      # never dialled, token-transfer ingestion never starts, and every
      # contract call returns ErrNoSoroban. Neither value is a secret.
      #
      # The start ledger is where transfer ingestion begins when it has no
      # cursor yet. An RPC keeps only a bounded window of events, so zero is
      # not "from the beginning" — it means the oldest the endpoint still
      # holds. Naming a ledger is how you say which history you accept having
      # missed; get a current one from getLatestLedger.
      - key: STELFIN_SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELFIN_SOROBAN_START_LEDGER
        sync: false

      - key: STELFIN_ASSET_CODE
        value: USDC
      - key: STELFIN_ASSET_ISSUER
        sync: false

      # Testnet-acceptable per config.go's own warning; move to an HSM/KMS
      # signer before this ever points at mainnet.
      - key: STELFIN_TREASURY_SEED
        sync: false

      # Signs SEP-10 challenges. Must be a different key from the treasury —
      # it signs attacker-chosen material and holds nothing.
      - key: STELFIN_WEBAUTH_SEED
        sync: false


      # Telegram. Both or neither. The secret is echoed back on every
      # delivery and is the only thing authenticating it, since Telegram does
      # not sign — openssl rand -hex 32. stelfin gives it to Telegram itself
      # at start, along with where to deliver, so there is no setWebhook to run.
      - key: STELFIN_TELEGRAM_BOT_TOKEN
        sync: false
      - key: STELFIN_TELEGRAM_WEBHOOK_SECRET
        sync: false

      # Discord. All three together. The public key verifies a signature rather
      # than authorising anything, so it is not a secret — the bot token is.
      # Point the Interactions Endpoint URL at <base>/webhook/discord.
      - key: STELFIN_DISCORD_PUBLIC_KEY
        sync: false
      - key: STELFIN_DISCORD_BOT_TOKEN
        sync: false
      - key: STELFIN_DISCORD_APPLICATION_ID
        sync: false

      # openssl rand -hex 32 — at least 32 bytes, signs both confirm and
      # enroll links.
      - key: STELFIN_CONFIRM_TOKEN_SECRET
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STELFIN_DECODER_EFFORT
        value: ""
      - key: STELFIN_SHUTDOWN_GRACE
        value: 20s

      # The kill switch. Set to "true" in the dashboard and redeploy to stop
      # everything that builds or submits while leaving reads up.
      - key: STELFIN_READONLY
        value: "false"
      # The same switch without a redeploy: while this file exists, nothing is
      # built or submitted.
      - key: STELFIN_READONLY_FILE
        value: /tmp/stelfin-readonly

      # Calling allowed third-party contracts. On, because this blueprint is
      # pinned to testnet above and a call there moves nothing of value. Contract
      # calls are not bounded by the spend ceilings, so a deployment on the
      # public network turns this on deliberately or not at all.
      - key: STELFIN_CONTRACT_CALLS
        value: "true"

      # Deployment-wide ceilings on treasury proposals, in whole units of the
      # asset. Optional on testnet; the server refuses to start on the public
      # network without them.
      - key: STELFIN_MAX_PAYMENT
        sync: false
      - key: STELFIN_MAX_DAILY
        sync: false

      # Connectors. Optional; each enables its own half. The key seals
      # connector endpoints and tokens at rest (openssl rand -hex 32). The
      # service account is the JSON key Google issues, pasted whole.
      - key: STELFIN_CONNECTOR_KEY
        sync: false
      - key: STELFIN_GOOGLE_SERVICE_ACCOUNT
        sync: false
