<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Create a wallet.

  Generates a Stellar keypair in the browser and asks the server to build a
  sponsored-provisioning transaction for it. The secret never leaves this
  device: it is written to localStorage and nothing else. The page parses the
  transaction it is asked to sign and refuses to sign anything that is not
  exactly the four sponsored-creation operations for the address it asked
  for — the same "verify what you're about to sign" posture as confirm.js.

  Referrer-Policy keeps the fragment-borne token out of any outbound request.
-->
<meta name="referrer" content="no-referrer">
<title>Create your wallet · stelfin</title>
<style>
  :root {
    /* The type scale. Six steps, each visibly different from its neighbours.
       What was here before was nine sizes, five of which sat inside a 2px band
       (0.78, 0.82, 0.85, 0.9, 0.92rem) and were therefore not a hierarchy at
       all, just noise, followed by a single 2.1x leap to the amount. The leap
       is right: on a page whose job is to show one figure, that figure should
       dominate. The mush underneath it was not. */
    --t-mono: 0.8125rem; --t-sm: 0.875rem; --t-md: 1rem;
    --t-lg: 1.125rem; --t-xl: 1.5rem; --t-2xl: 2.5rem;
    --bg: #ffffff; --fg: #16181d; --muted: #5c6370;
    --line: #e3e6ea; --accent: #14713d; --on-accent: #ffffff; --on-danger: #ffffff; --danger: #a4291f; --danger-bg: #fdf2f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #f0f2f5; --muted: #9aa3af;
      --line: #2a2e36; --accent: #4ec27f; --on-accent: #08130c; --on-danger: #2a0f0c; --danger: #ff8b80; --danger-bg: #2a1b1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 26rem; }
  h1 { font-size: var(--t-lg); font-weight: 600; margin: 0 0 0.6rem; text-wrap: balance; }
  p.lede { color: var(--muted); margin: 0 0 1.5rem; font-size: var(--t-md); }
  dl { border-top: 1px solid var(--line); margin: 0 0 1.5rem; padding-top: 0.75rem; }
  .row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.4rem 0; font-size: var(--t-sm); }
  .row dt { color: var(--muted); margin: 0; flex: none; }
  .row dd { margin: 0; text-align: right; word-break: break-all; font-variant-numeric: tabular-nums; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--t-mono); }
  button {
    width: 100%; padding: 0.85rem 1rem; font: inherit; font-weight: 600;
    color: var(--on-accent); background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
  }
  button:hover:not([disabled]) { filter: brightness(1.08); }
  button:active:not([disabled]) { transform: translateY(1px); }
  button[disabled] { opacity: 0.6; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The refusal box takes focus so a screen reader announces it, which
     also gives it a ring. The ring should be its own colour: an accent-
     green outline around a red warning reads as a control to press. */
  .alert:focus-visible { outline-color: var(--danger); }
  .note { font-size: var(--t-sm); color: var(--muted); margin-top: 0.85rem; }
  .note.center { text-align: center; }
  .alert {
    background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger);
    border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 1.25rem; font-size: var(--t-sm);
  }
  .alert strong { display: block; margin-bottom: 0.25rem; }
  /* A 56-character Stellar address in a space-between row has nowhere to go
     on a narrow screen. Stacking the label above the value gives it the full
     width instead of squeezing both. */
  @media (max-width: 26rem) {
    .row { flex-direction: column; gap: 0.15rem; }
    .row dd { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active:not([disabled]) { transform: none; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="alert" class="alert" tabindex="-1" hidden></div>

  <section id="pending" hidden>
    <h1>Create your wallet</h1>
    <p class="lede">
      A key is generated on this device and never leaves it. stelfin sponsors
      the account so you never need to hold XLM.
    </p>
    <dl>
      <div class="row"><dt>Address</dt><dd><code id="address" translate="no"></code></dd></div>
    </dl>
    <button id="create" type="button">Create wallet</button>
    <p class="note center">This device becomes the one that can sign your payments.</p>
  </section>

  <section id="done" hidden>
    <h1>Your wallet is ready</h1>
    <p class="lede">You can close this page and go back to your chat.</p>
  </section>
</main>

<script src="/static/stellar-sdk.min.js"></script>
<script src="/static/enroll.js"></script>
</body>
</html>
