<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Create a wallet.

  Generates a Stellar keypair in the browser and asks the server to build a
  sponsored-provisioning transaction for it. The secret never leaves this
  device: it is written to localStorage and nothing else. The page parses the
  transaction it is asked to sign and refuses to sign anything that is not
  exactly the four sponsored-creation operations for the address it asked
  for — the same "verify what you're about to sign" posture as confirm.js.

  Referrer-Policy keeps the fragment-borne token out of any outbound request.
-->
<meta name="referrer" content="no-referrer">
<title>Create your wallet · stelfin</title>
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --muted: #5c6370;
    --line: #e3e6ea; --accent: #14713d; --danger: #a4291f; --danger-bg: #fdf2f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #f0f2f5; --muted: #9aa3af;
      --line: #2a2e36; --accent: #4ec27f; --danger: #ff8b80; --danger-bg: #2a1b1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 26rem; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 0.6rem; }
  p.lede { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.92rem; }
  dl { border-top: 1px solid var(--line); margin: 0 0 1.5rem; padding-top: 0.75rem; }
  .row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.4rem 0; font-size: 0.9rem; }
  .row dt { color: var(--muted); margin: 0; flex: none; }
  .row dd { margin: 0; text-align: right; word-break: break-all; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
  button {
    width: 100%; padding: 0.85rem 1rem; font: inherit; font-weight: 600;
    color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
  }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }
  .note { font-size: 0.85rem; color: var(--muted); margin-top: 0.85rem; text-align: center; }
  .alert {
    background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger);
    border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 1.25rem; font-size: 0.9rem;
  }
  .alert strong { display: block; margin-bottom: 0.25rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="alert" class="alert" hidden></div>

  <section id="pending" hidden>
    <h1>Create your wallet</h1>
    <p class="lede">
      A key is generated on this device and never leaves it. stelfin sponsors
      the account so you never need to hold XLM.
    </p>
    <dl>
      <div class="row"><dt>Address</dt><dd><code id="address"></code></dd></div>
    </dl>
    <button id="create" type="button">Create wallet</button>
    <p class="note">This device becomes the one that can sign your payments.</p>
  </section>

  <section id="done" hidden>
    <h1>Your wallet is ready</h1>
    <p class="lede">You can close this page and go back to WhatsApp.</p>
  </section>
</main>

<script src="/static/stellar-sdk.min.js"></script>
<script src="/static/enroll.js"></script>
</body>
</html>
